# =============================================================
# 校园自习室座位预约管理系统 — 主配置文件
# =============================================================

spring:
  application:
    name: seat-reservation
  profiles:
    active: dev

  # ---- 数据源配置 ----
  datasource:
    url: jdbc:mysql://localhost:3306/seat_reservation?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      pool-name: SeatHikariPool
      connection-test-query: SELECT 1

  # ---- JPA 配置 ----
  jpa:
    hibernate:
      ddl-auto: validate   # 生产环境使用 validate，开发可改为 update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ---- Redis 配置 ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

  # ---- 文件上传 ----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ---- MyBatis Plus 配置 ----
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.library
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-fetch-size: 100
    default-statement-timeout: 30
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 服务器配置 ----
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    max-connections: 500
    threads:
      max: 100
      min-spare: 10
    accept-count: 100

# ---- SpringDoc OpenAPI 配置 ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.example.library.module

# ---- 日志配置 ----
logging:
  level:
    root: INFO
    com.example.library: DEBUG
    org.springframework.security: INFO
  file:
    path: ./logs
    name: ./logs/app.log
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n'
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB

# ---- 业务自定义配置 ----
app:
  jwt:
    secret: ${JWT_SECRET:xZHiOZ/ryAxzr89cUFsrkNMuXnrTC+o0YQtj6kmM5zfaEE5L18qRN+xeMY7uD0AnJVV55N2KrHGKXiNmDKAdJg==}
    access-token-expiration: 7200       # 2小时(秒)
    refresh-token-expiration: 604800    # 7天(秒)
  reservation:
    max-end-time: "22:00"               # 最晚预约结束时间
    no-show-timeout-minutes: 15         # 超时未签到爽约阈值(分钟)
    violation-threshold: 3              # 累计爽约触发惩罚次数
    violation-ban-days: 10              # 惩罚禁约天数
  notification:
    sms-enabled: false                  # 短信开关(本地开发关闭)
    sign-in-remind-minutes: 15          # 签到提前提醒(分钟)
  scheduler:
    no-show-check-rate: 1000            # 爽约扫描周期(毫秒)
    timeout-check-rate: 60000           # 超时离座扫描周期(毫秒)
